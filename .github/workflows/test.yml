name: Verify Windows runtime and macOS companion
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Parse Windows PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem gpt-niang-usage -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            $source=[IO.File]::ReadAllText($_.FullName,[Text.Encoding]::UTF8)
            $null=[Management.Automation.Language.Parser]::ParseInput($source,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($_.FullName+': '+($errors.Message -join '; '))}
          }
      - name: Windows port animation and quota tests
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File gpt-niang-usage/tests/windows-port.test.ps1 -OutputDirectory "$env:RUNNER_TEMP/port-frames"
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - name: Shared Node runtime tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Prepare isolated installer fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'gpt-niang-test-bin'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $fixture 'codex.exe')
          $fixture | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows installer, lifecycle and WPF tests
        working-directory: gpt-niang-usage
        run: npm run test:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-port-frames
          path: ${{ runner.temp }}/port-frames
          if-no-files-found: ignore
  macos:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Node runtime and crash recovery tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Swift behavior tests
        run: swift test --package-path macos
      - name: Build native app bundle
        run: ./script/build_and_run.sh --build-only
      - name: Verify app signature
        run: codesign --verify --deep --strict dist/XiaoBaiLongNiangMac.app
